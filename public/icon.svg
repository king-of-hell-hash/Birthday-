<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b18" />
      <stop offset="60%" stop-color="#0f1015" />
      <stop offset="100%" stop-color="#07080b" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE588" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#EDC967" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Crown / Cake motif -->
  <g transform="translate(106, 120)" filter="url(#glow)">
    <!-- Golden Crown / Celebration Motif -->
    <path d="M30 200 L60 80 L120 150 L150 40 L180 150 L240 80 L270 200 Z" fill="url(#gold)" />
    <!-- Base band -->
    <rect x="25" y="200" width="250" height="32" rx="8" fill="url(#gold)" />
    <!-- Gems / Stars -->
    <circle cx="150" cy="30" r="14" fill="#FFFFFF" />
    <circle cx="60" cy="70" r="10" fill="#FFFFFF" />
    <circle cx="240" cy="70" r="10" fill="#FFFFFF" />
    <!-- Monogram Initial 'A' for Aryan -->
    <text x="150" y="185" font-family="'Cinzel', serif, Georgia" font-size="64" font-weight="bold" fill="#07080B" text-anchor="middle">A</text>
  </g>

  <!-- Sparkles -->
  <g fill="url(#gold)">
    <polygon points="120,90 125,105 140,110 125,115 120,130 115,115 100,110 115,105" />
    <polygon points="380,110 384,122 396,126 384,130 380,142 376,130 364,126 376,122" />
    <polygon points="370,360 374,372 386,376 374,380 370,392 366,380 354,376 366,372" />
    <polygon points="130,370 133,380 143,383 133,386 130,396 127,386 117,383 127,380" />
  </g>

  <!-- Subtitle Text: ARYAN -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="8" fill="url(#gold)" text-anchor="middle">ARYAN</text>
  <text x="256" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" letter-spacing="4" fill="#E2E8F0" fill-opacity="0.8" text-anchor="middle">CELEBRATION</text>
</svg>
